<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fundo do Espaço -->
  <rect width="512" height="512" rx="120" fill="#070714"/>
  
  <!-- Borda Roxa Neon -->
  <rect width="472" height="472" x="20" y="20" rx="100" fill="none" stroke="#7b2cbf" stroke-width="24"/>
  
  <!-- Letra N (Estelar - Branca) -->
  <text x="100" y="360" font-family="Arial, sans-serif" font-size="280" font-weight="900" fill="#ffffff" letter-spacing="-10">N</text>
  
  <!-- Letra C (Cometa - Ciano) -->
  <text x="250" y="380" font-family="Arial, sans-serif" font-size="300" font-weight="900" fill="#4cc9f0" opacity="0.9">C</text>
</svg>
